<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blake's Game Shelf</title>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,700;0,800;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#161210;--bg2:#1c1814;--card:#221e19;
  --tx:#e0d8cc;--txd:rgba(224,216,204,0.4);--txm:rgba(224,216,204,0.6);
  --gold:#c9a24d;--rust:#c75a30;--forest:#5a8a5a;--slate:#8a9aaa;
  --border:rgba(224,216,204,0.1);--bordlt:rgba(224,216,204,0.06);
  --fd:'Bitter',Georgia,serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:rgba(224,216,204,0.2) transparent;scrollbar-width:thin}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(224,216,204,0.15);border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-weight:400;min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

.wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}

header{padding:40px 0 28px;border-bottom:1px solid rgba(224,216,204,0.15);margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hl h1{font-family:var(--fd);font-size:clamp(2rem,5vw,3rem);font-weight:800;line-height:1;letter-spacing:-0.02em}
.hl h1 span{color:var(--gold);font-style:italic}
.hl p{margin-top:6px;color:var(--txd);font-size:0.8rem;letter-spacing:0.05em;text-transform:uppercase}
.badge{background:rgba(224,216,204,0.06);border:1px solid var(--border);font-family:var(--fd);font-size:2rem;font-weight:700;padding:10px 20px;text-align:center;line-height:1;color:var(--gold);border-radius:4px}
.badge small{display:block;font-family:var(--fb);font-size:0.6rem;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;margin-top:4px;color:var(--txd)}

.fbar{background:var(--card);border:1px solid var(--border);padding:14px 16px;margin-bottom:24px;border-radius:4px;position:sticky;top:0;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,0.35)}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frow+.frow,.frow+.frow-more .frow:first-child,.frow-more+.frow{margin-top:10px;padding-top:10px;border-top:1px solid var(--bordlt)}
.flbl{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--txd);font-weight:600;margin-right:4px;flex-shrink:0}
.sw{position:relative;display:inline-flex}
.si{border:1px solid var(--border);background:rgba(224,216,204,0.05);padding:7px 26px 7px 12px;color:var(--tx);font-size:13px;font-family:var(--fb);width:200px;outline:none;border-radius:3px}
.si:focus{border-color:rgba(201,162,77,0.5)}.si::placeholder{color:var(--txd)}
.sx{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--txd);cursor:pointer;font-size:0.85rem;padding:2px 6px}
.sx:hover{color:var(--tx)}

.pill{padding:5px 12px;border:1px solid var(--border);background:rgba(224,216,204,0.03);font-size:0.72rem;font-family:var(--fb);font-weight:500;cursor:pointer;transition:all 0.12s;white-space:nowrap;color:var(--txd);border-radius:4px}
.pill:hover{border-color:rgba(224,216,204,0.25);color:var(--txm)}
.pill:active,.pc:active{transform:scale(0.96)}
.pill.zero{opacity:0.35}
.pill .pn{opacity:0.55;font-weight:400;margin-left:4px;font-size:0.65rem}
.pill.on{background:rgba(201,162,77,0.2);border-color:rgba(201,162,77,0.4);color:var(--gold)}
.pm-party.on{background:rgba(199,90,48,0.12);border-color:rgba(199,90,48,0.3);color:#e07050}
.pm-euro.on{background:rgba(90,138,90,0.12);border-color:rgba(90,138,90,0.3);color:#7ab07a}
.pm-mid.on{background:rgba(90,120,160,0.12);border-color:rgba(90,120,160,0.3);color:#8ab0d0}
.pm-epic.on{background:rgba(140,80,170,0.12);border-color:rgba(140,80,170,0.3);color:#b88ae0}
.pm-family.on{background:rgba(60,140,80,0.12);border-color:rgba(60,140,80,0.3);color:#60c080}
.pc{background:none;border:1px solid var(--border);padding:4px 10px;color:var(--txd);font-size:0.68rem;font-family:var(--fb);cursor:pointer;border-radius:4px}
.pc:hover{color:var(--tx);border-color:rgba(224,216,204,0.25)}

.status{font-size:0.78rem;color:var(--txd);margin-bottom:20px;min-height:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:5px;font-size:0.68rem;font-family:var(--fb);padding:3px 10px;border:1px solid var(--border);border-radius:20px;color:var(--txm);background:rgba(224,216,204,0.04);cursor:pointer;transition:all 0.12s}
.fchip:hover{border-color:rgba(224,216,204,0.3);color:var(--tx)}
.fchip .x{color:var(--txd);font-size:0.6rem}
.empty .echips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
@keyframes cardIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes diceShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}75%{transform:rotate(-6deg)}}
.diceBtn.anim{animation:diceShake 0.4s ease}

.shelf{margin-bottom:32px}
.shelf-hdr{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.shelf-title{font-family:var(--fd);font-size:1.15rem;font-weight:800;color:var(--tx)}
.shelf-count{font-size:0.72rem;color:var(--txd);font-weight:500}
.shelf-desc{font-size:0.75rem;color:var(--txd);font-style:italic;margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}

.card{background:var(--card);border:1px solid var(--border);padding:12px 12px 12px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;position:relative;overflow:hidden;transition:transform 0.12s,box-shadow 0.12s,border-color 0.12s;border-radius:4px;animation:cardIn 0.18s ease both}
.card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:4px 0 0 4px}
.card:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,0.4);border-color:rgba(224,216,204,0.15)}
.card.cmp{box-shadow:0 0 0 2px var(--slate);border-color:transparent}
.card[data-wc="5"]::before{background:var(--rust)}
.card[data-wc="4"]::before{background:var(--gold)}
.card[data-wc="3"]::before{background:var(--forest)}
.card[data-wc="2"]::before{background:#5a9e7a}
.card[data-wc="1"]::before{background:#9e9a5e}
.wdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.card[data-wc="5"] .wdot{background:var(--rust)}
.card[data-wc="4"] .wdot{background:var(--gold)}
.card[data-wc="3"] .wdot{background:var(--forest)}
.card[data-wc="2"] .wdot{background:#5a9e7a}
.card[data-wc="1"] .wdot{background:#9e9a5e}

.card-thumb{flex-shrink:0;width:64px;height:64px;overflow:hidden;border-radius:3px;position:relative;background:rgba(224,216,204,0.06)}
.card-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 0.3s}
.card-thumb img.ld{opacity:1}
.card-thumb .av{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;position:absolute;inset:0;pointer-events:none;transition:opacity 0.3s}
.card-thumb:has(img.ld) .av{opacity:0}

.card-body{flex:1;min-width:0}
.card-title{font-family:var(--fd);font-size:0.9rem;font-weight:700;line-height:1.2;margin-bottom:3px}
.card-stats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.tag{font-size:0.62rem;letter-spacing:0.04em;text-transform:uppercase;padding:2px 6px;font-weight:600;border-radius:2px}
.tag-p{background:rgba(90,138,90,0.15);color:var(--forest)}
.tag-t{background:rgba(201,162,77,0.12);color:rgba(201,162,77,0.7)}
.tag-w{background:rgba(224,216,204,0.06);color:var(--txd)}
.card-vibe{font-size:0.76rem;color:var(--txm);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-mechs{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.mech{font-size:0.56rem;letter-spacing:0.03em;text-transform:uppercase;padding:1px 5px;border:1px solid var(--bordlt);color:var(--txd);border-radius:2px;font-weight:500}

.empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--txd)}
.empty h3{font-family:var(--fd);font-size:1.2rem;margin-bottom:6px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,8,5,0.75);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity 0.2s}
.overlay.on{opacity:1}
.modal{background:var(--bg2);border:1px solid rgba(224,216,204,0.15);max-width:600px;width:100%;max-height:85vh;overflow-y:auto;padding:28px;position:relative;transform:translateY(8px);transition:transform 0.2s;border-radius:6px}
.mroll{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:6px 10px;font-size:0.72rem;color:var(--txd);border:1px dashed var(--border);border-radius:4px}
.overlay.on .modal{transform:translateY(0)}
.modal-x{position:absolute;top:10px;right:12px;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--txd);padding:4px 8px;z-index:5}
.modal-x:hover{color:var(--tx)}
.modal-top{display:flex;gap:16px;margin-bottom:16px}
.modal-thumb{flex-shrink:0;width:88px;height:88px;overflow:hidden;border-radius:3px;position:relative;background:rgba(224,216,204,0.06)}
.modal-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.modal-thumb .av{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.modal-thumb img.ld+.av{display:none}
.modal-info h2{font-family:var(--fd);font-size:1.25rem;font-weight:800;line-height:1.2;margin-bottom:8px}
.modal-stats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.modal-stats .tag{font-size:0.72rem;padding:3px 8px}
.modal-shelf{font-size:0.7rem;color:var(--txd);font-style:italic}
.modal-section{margin-bottom:14px}
.modal-section h3{font-family:var(--fd);font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--txd);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--bordlt)}
.modal-vibe{font-size:0.88rem;color:var(--txm);line-height:1.6}
.modal-mechs{display:flex;flex-wrap:wrap;gap:5px}
.modal-mechs .mech{font-size:0.7rem;padding:3px 8px;background:rgba(224,216,204,0.06);border:1px solid var(--border)}
.modal-moods{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:0.62rem;letter-spacing:0.04em;text-transform:uppercase;padding:3px 9px;border-radius:20px;font-weight:600}
.chip-party{background:rgba(199,90,48,0.15);color:#e07050}
.chip-euro{background:rgba(90,138,90,0.15);color:#7ab07a}
.chip-mid{background:rgba(90,120,160,0.15);color:#8ab0d0}
.chip-epic{background:rgba(140,80,170,0.15);color:#b88ae0}
.chip-family{background:rgba(60,140,80,0.15);color:#60c080}
.likedis{margin-top:4px}
.ld-cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
.likedis .ld-title{font-size:0.76rem;font-weight:700;margin-bottom:4px;color:var(--txm)}
.likedis .ld-title.like{color:#7ab07a}
.likedis .ld-title.dislike{color:#d08070}
.likedis ul{margin:0 0 10px 16px;padding:0}
.likedis li{font-size:0.82rem;color:var(--txm);line-height:1.5;margin-bottom:2px}
.bgg-btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--bg);padding:11px 24px;font-family:var(--fb);font-size:0.85rem;font-weight:700;letter-spacing:0.03em;text-decoration:none;transition:background 0.15s;margin-top:6px;border-radius:4px}
.bgg-btn:hover{background:#d4ad58}

/* Compare panel */
.cpanel{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid rgba(224,216,204,0.15);box-shadow:0 -8px 30px rgba(0,0,0,0.5);z-index:100;transform:translateY(100%);transition:transform 0.3s;padding:14px 20px;max-height:50vh;overflow-y:auto}
.cpanel.show{transform:translateY(0)}
.cphdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cphdr h3{font-family:var(--fd);font-size:0.95rem;font-weight:700}
.cpclear{font-size:0.7rem;color:var(--txd);cursor:pointer;background:none;border:1px solid var(--border);padding:4px 10px;font-family:var(--fb);border-radius:4px}
.cptable-wrap{overflow-x:auto}
.cpanel table{width:100%;border-collapse:collapse;table-layout:fixed}
.cpanel th,.cpanel td{padding:5px 6px;text-align:left;vertical-align:top;border-bottom:1px solid var(--bordlt)}
.cpanel th{font-size:0.62rem;color:var(--txd);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;width:70px}
.cpanel td{font-size:0.76rem;color:var(--tx)}
.cpname{font-family:var(--fd);font-size:0.82rem;font-weight:700;line-height:1.2;margin-bottom:2px}
.cpvibe{font-size:0.68rem;color:var(--txd);line-height:1.3;font-style:italic}
.cpbgg{display:inline-block;padding:4px 10px;font-size:0.7rem;font-weight:600;color:var(--gold);text-decoration:none;background:rgba(201,162,77,0.1);border:1px solid rgba(201,162,77,0.3);border-radius:3px}
.wbar{display:inline-block;height:5px;border-radius:3px;vertical-align:middle;margin-left:4px}

.card .cf{position:absolute;top:5px;right:5px;width:22px;height:22px;display:none;align-items:center;justify-content:center;font-size:11px;cursor:pointer;z-index:5;background:var(--card);border:1px solid var(--border);border-radius:3px;transition:all 0.12s}
.card .cf.sel{display:flex!important;background:rgba(138,154,170,0.3);border-color:var(--slate)}
.card:hover .cf{display:flex}

.legend{margin-top:36px;padding-top:16px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:14px;font-size:0.7rem;color:var(--txd);align-items:center}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-bar{width:10px;height:10px;flex-shrink:0;border-radius:2px}

.moreToggle{display:none}
@media(max-width:600px){
  header{flex-direction:column;align-items:flex-start}
  .grid{grid-template-columns:1fr}
  .sw{width:100%}
  .si{width:100%}
  .ld-cols{grid-template-columns:1fr}
  .shelf-desc{display:none}
  .modal{padding:20px}
  .cpanel{max-height:60vh}
  .cpanel table{table-layout:auto;min-width:560px}
  .cpanel th{width:60px}
  .cpanel td{min-width:140px}
  .moreToggle{display:inline-block}
  .frow-more{display:none}
  .frow-more.show{display:block}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hl">
      <h1>Blake's <span>Game Shelf</span></h1>
      <p>Browse · Filter · Pick something to play</p>
    </div>
    <div class="badge"><span id="total">0</span><small>games owned</small></div>
  </header>
  <div class="fbar" id="filters"></div>
  <div class="status" id="status"></div>
  <div id="shelves"></div>
  <div class="legend">
    <strong style="font-size:.7rem;color:var(--tx)">Weight:</strong>
    <div class="legend-item"><div class="legend-bar" style="background:var(--rust)"></div>Heavy</div>
    <div class="legend-item"><div class="legend-bar" style="background:var(--gold)"></div>Med-Heavy</div>
    <div class="legend-item"><div class="legend-bar" style="background:var(--forest)"></div>Medium</div>
    <div class="legend-item"><div class="legend-bar" style="background:#5a9e7a"></div>Med-Light</div>
    <div class="legend-item"><div class="legend-bar" style="background:#9e9a5e"></div>Light</div>
  </div>
</div>
<div class="cpanel" id="cpanel"></div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-x" onclick="closeModal()">✕</button>
    <div class="mroll" id="m-roll" style="display:none">
      <span>🎲 Random pick from your current filters</span>
      <button class="pc" onclick="pickRandom()">Roll again</button>
    </div>
    <div class="modal-top">
      <div class="modal-thumb" id="m-thumb">
        <img id="m-img" src="" alt="" onload="this.classList.add('ld')">
        <div class="av" id="m-av"></div>
      </div>
      <div class="modal-info">
        <h2 id="m-title"></h2>
        <div class="modal-stats" id="m-stats"></div>
        <div class="modal-shelf" id="m-shelf"></div>
      </div>
    </div>
    <div class="modal-section"><h3>About This Game</h3><div class="modal-vibe" id="m-vibe"></div></div>
    <div class="modal-section" id="m-ld-section"></div>
    <div class="modal-section"><h3>Mechanics</h3><div class="modal-mechs" id="m-mechs"></div></div>
    <div class="modal-section"><h3>Vibes</h3><div class="modal-moods" id="m-moods"></div></div>
    <a class="bgg-btn" id="m-btn" href="#" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Open on BoardGameGeek
    </a>
  </div>
</div>

<script src="games.js"></script>
<script>
const CONFIG = {
  api: {
    endpoint:   "https://boardgamegeek.com/xmlapi2/thing",
    token:      "",        // Bearer token if needed
    batchSize:  20,        // IDs per request
    retryDelay: 3000,      // ms after a 202 before retrying
    maxRetries: 5,         // max 202 retry attempts per batch
    batchDelay: 1500,      // ms between batches
  },
  cache: {
    key:             "bgs_v8",     // bump suffix to bust the image cache
    minValidEntries: 20,
    stateKey:        "bgs_state_v1",  // bump suffix to reset saved filters
  },
  weight: {
    heavy:    3.5,   // >= this → category 5 (Heavy)
    medHeavy: 2.8,   // >= this → category 4 (Med-Heavy)
    medium:   2.1,   // >= this → category 3 (Medium)
    medLight: 1.5,   // >= this → category 2 (Med-Light)
  },
  time: {
    quick:  20,   // <= this minutes → "quick"
    short:  45,   // <= this minutes → "short"
    medium: 90,   // <= this minutes → "medium"
  },
  ui: {
    maxCompare:      3,    // max games in compare panel at once
    modalCloseDelay: 200,  // ms for fade-out before display:none
    searchDebounce:  150,  // ms of idle typing before the grid re-renders
  },
  avatarColors: [
    '#9e4e28','#b87820','#2d5a2d','#4a6080',
    '#6a3080','#5a5020','#357060','#705030',
  ],
};
const ML=MECHANICS;
function wCat(w){const t=CONFIG.weight;return w>=t.heavy?5:w>=t.medHeavy?4:w>=t.medium?3:w>=t.medLight?2:1;}
const WLABELS={5:"Heavy",4:"Med-Heavy",3:"Medium",2:"Med-Light",1:"Light"};
function maxTime(t){const n=t.match(/\d+/g);return n?Math.max(...n.map(Number)):30;}
function timeGroup(t){const m=maxTime(t),thr=CONFIG.time;return m<=thr.quick?"quick":m<=thr.short?"short":m<=thr.medium?"medium":"long";}

// Game data lives in games.js. Map its readable field names to the short
// internal ones the rendering code uses, and derive min/max players.
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
const G=GAMES.map(g=>{
  const [pn,px]=String(g.players).split("-").map(Number);
  return{n:g.name,bgg:g.bgg||null,id:g.bgg?String(g.bgg):slug(g.name),p:g.players,pn,px:px||pn,t:String(g.time),
    w:g.weight,shelf:g.shelf,i:g.emoji,m:g.mechanics||[],md:g.moods||[],v:g.blurb||"",pro:g.pros||[],con:g.cons||[]};
});
const bggUrl=g=>g.bgg?`https://boardgamegeek.com/boardgame/${g.bgg}`:`https://boardgamegeek.com/geeksearch.php?action=search&objecttype=boardgame&q=${encodeURIComponent(g.n)}`;

const WEIGHT_GROUPS=[
  {id:5,name:"Heavy",desc:"Plan your evening around these",icon:"🪨"},
  {id:4,name:"Medium-Heavy",desc:"Meaty but manageable",icon:"⚙️"},
  {id:3,name:"Medium",desc:"The sweet spot for most game nights",icon:"⚖️"},
  {id:2,name:"Medium-Light",desc:"Easy to teach, satisfying to play",icon:"🍃"},
  {id:1,name:"Light",desc:"Grab-and-go with zero rules overhead",icon:"🪶"},
];
const MOOD_GROUPS=[
  {id:"epic",name:"Epic",desc:"Big commitment, big payoff",icon:"🏔️"},
  {id:"euro",name:"Thinky Euro",desc:"Elegant systems and economic puzzles",icon:"🧠"},
  {id:"mid",name:"Mid-Weight",desc:"Accessible strategy with real depth",icon:"🎯"},
  {id:"party",name:"Party",desc:"Social energy over strategic depth",icon:"🎉"},
  {id:"family",name:"Family",desc:"Works for all ages and experience levels",icon:"👨‍👩‍👧‍👦"},
];
const TIME_GROUPS=[
  {id:"quick",name:"Quick Games",desc:"20 minutes or less",max:20,icon:"⚡"},
  {id:"short",name:"Short Games",desc:"Under 45 minutes",max:45,icon:"⏱️"},
  {id:"medium",name:"Medium Games",desc:"45-90 minutes",max:90,icon:"🕰️"},
  {id:"long",name:"Long Games",desc:"90+ minute commitment",max:999,icon:"🌙"},
];

const PF=[
  {id:"any",l:"Any #",f:()=>true},
  {id:"2p",l:"2p",f:g=>g.pn<=2&&g.px>=2},
  {id:"2ponly",l:"2p Only",f:g=>g.pn===2&&g.px===2},
  {id:"3-4",l:"3-4",f:g=>g.pn<=3&&g.px>=3},
  {id:"5+",l:"5+",f:g=>g.px>=5},
];

const TF=[{id:"any",l:"Any time"},...TIME_GROUPS.map(t=>({id:t.id,l:t.name}))];

const GROUPS=[
  {l:"Shelf",id:"shelf"},
  {l:"Weight",id:"weight"},
  {l:"Mood",id:"mood"},
  {l:"Play Time",id:"time"},
];
const SORTS=[
  {id:"lightest",l:"Lightest first",f:(a,b)=>a.w-b.w},
  {id:"heaviest",l:"Heaviest first",f:(a,b)=>b.w-a.w},
  {id:"az",l:"A → Z",f:(a,b)=>a.n.localeCompare(b.n)},
];

const DEFAULT_STATE={q:"",pf:"any",mood:null,time:"any",cmp:[],sort:"lightest",group:"shelf"};
function loadState(){
  try{
    const raw=localStorage.getItem(CONFIG.cache.stateKey);
    if(raw){const saved=JSON.parse(raw);return{...DEFAULT_STATE,...saved,cmp:[]};}
  }catch(e){console.warn('[State] Could not load saved filters:',e);}
  return{...DEFAULT_STATE};
}
function saveState(){
  try{localStorage.setItem(CONFIG.cache.stateKey,JSON.stringify({q:S.q,pf:S.pf,mood:S.mood,time:S.time,sort:S.sort,group:S.group}));}
  catch(e){console.warn('[State] Could not save filters:',e);}
}
let S=loadState();
const imgCache={};

function avColor(str){
  const pal=CONFIG.avatarColors;
  let h=0;for(let i=0;i<str.length;i++)h=(str.charCodeAt(i)+((h<<5)-h))|0;
  return pal[Math.abs(h)%pal.length];
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const clamp=v=>Math.max(0,Math.min(255,v));
  const r=clamp(((n>>16)&255)+amt),g=clamp(((n>>8)&255)+amt),b=clamp((n&255)+amt);
  return`rgb(${r},${g},${b})`;
}
function avGradient(color){return`linear-gradient(135deg, ${shade(color,30)}, ${shade(color,-20)})`;}

async function fetchImages(){
  try{const c=localStorage.getItem(CONFIG.cache.key);if(c){const p=JSON.parse(c);if(p&&Object.keys(p).length>CONFIG.cache.minValidEntries){Object.assign(imgCache,p);updateThumbsInPlace();refreshImages(p);return;}}}catch(e){}
  await refreshImages({});
}
async function refreshImages(ex){
  const ids=G.filter(g=>g.bgg).map(g=>g.bgg),bs=CONFIG.api.batchSize,all={...ex};
  for(let i=0;i<ids.length;i+=bs){
    const batch=ids.slice(i,i+bs);
    try{
      const url=`${CONFIG.api.endpoint}?id=${batch.join(",")}`;
      const opts={};
      if(CONFIG.api.token)opts.headers={"Authorization":"Bearer "+CONFIG.api.token};
      let r=await fetch(url,opts);
      let attempts=0;
      while(r.status===202&&attempts++<CONFIG.api.maxRetries){await new Promise(res=>setTimeout(res,CONFIG.api.retryDelay));r=await fetch(url,opts);}
      if(r.status===202){console.warn('[BGG] Still queued after',CONFIG.api.maxRetries,'retries — batch skipped:',batch);}
      else if(!r.ok){console.warn('[BGG] HTTP',r.status,'for batch:',batch);}
      else{
        const xml=new DOMParser().parseFromString(await r.text(),"text/xml");
        xml.querySelectorAll("item").forEach(it=>{
          const id=parseInt(it.getAttribute("id")),im=it.querySelector("image"),th=it.querySelector("thumbnail");
          const u=(im&&im.textContent)||(th&&th.textContent);
          if(u&&id){all[id]=u.trim().replace(/^\/\//,"https://");imgCache[id]=all[id];}
          else if(id){console.warn('[BGG] No image found for game ID',id);}
        });
      }
    }catch(e){console.warn('[BGG] Fetch error:',e);}
    updateThumbsInPlace();
    await new Promise(r=>setTimeout(r,CONFIG.api.batchDelay));
  }
  try{localStorage.setItem(CONFIG.cache.key,JSON.stringify(all));}catch(e){console.warn('[BGG] Could not save image cache:',e);}
  updateThumbsInPlace();
}
function updateThumbsInPlace(){
  document.querySelectorAll('.card-thumb[data-id]').forEach(el=>{
    const src=imgCache[el.dataset.id];
    if(src){const img=el.querySelector('img');if(img&&!img.classList.contains('ld')){img.src=src;img.style.display='';}}
  });
}

function getFiltered(over){
  const st=over?{...S,...over}:S;
  let r=[...G];
  const pf=PF.find(f=>f.id===st.pf);if(pf&&st.pf!=="any")r=r.filter(pf.f);
  if(st.mood)r=r.filter(g=>g.md.includes(st.mood));
  if(st.time&&st.time!=="any")r=r.filter(g=>timeGroup(g.t)===st.time);
  if(st.q){
    const s=st.q.toLowerCase();
    r=r.filter(x=>
      x.n.toLowerCase().includes(s)||
      x.v.toLowerCase().includes(s)||
      x.m.some(m=>ML[m].toLowerCase().includes(s))||
      x.md.some(m=>(MOODS[m]||m).toLowerCase().includes(s))||
      x.pro.some(p=>p.toLowerCase().includes(s))||
      x.con.some(c=>c.toLowerCase().includes(s))||
      (SHELVES.find(sh=>sh.id===x.shelf)||{}).name?.toLowerCase().includes(s)
    );
  }
  return r;
}
const countFor=(key,id)=>getFiltered({[key]:id}).length;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

let filtersExpanded=false;
function toggleMoreFilters(){filtersExpanded=!filtersExpanded;renderFilters();}
function countPill(key,id,cls,label,onclick){
  const c=countFor(key,id);
  return`<button class="pill${cls}${c===0?' zero':''}" data-key="${key}" data-val="${id}" onclick="${onclick}">${label}<span class="pn">${c}</span></button>`;
}
function updatePillCounts(){
  document.querySelectorAll('.pill[data-key]').forEach(p=>{
    const c=countFor(p.dataset.key,p.dataset.val);
    p.querySelector('.pn').textContent=c;
    p.classList.toggle('zero',c===0);
  });
}
function renderFilters(){
  document.getElementById("filters").innerHTML=`
    <div class="frow">
      <span class="sw">
        <input class="si" id="sb" type="text" placeholder="Search games, vibes, mechanics..." autocomplete="off" value="${esc(S.q)}">
        <button class="sx" id="sx" style="display:${S.q?'':'none'}" onclick="clearSearch()" title="Clear search">✕</button>
      </span>
      <span class="flbl">Players</span>
      ${PF.map(f=>countPill('pf',f.id,S.pf===f.id?' on':'',f.l,`setPF('${f.id}')`)).join("")}
      <button class="pc diceBtn" onclick="pickRandom()" title="Pick a random game from the current filters">🎲 Pick for me</button>
      <button class="pc moreToggle" onclick="toggleMoreFilters()">${filtersExpanded?'▴':'▾'} More filters</button>
    </div>
    <div class="frow-more${filtersExpanded?' show':''}">
      <div class="frow">
        <span class="flbl">Mood</span>
        ${Object.keys(MOODS).map(k=>countPill('mood',k,` pm-${k}${S.mood===k?' on':''}`,MOODS[k],`setMood('${k}')`)).join("")}
        ${S.mood?`<button class="pc" onclick="setMood(null)">✕</button>`:""}
      </div>
      <div class="frow">
        <span class="flbl">Time</span>
        ${TF.map(t=>countPill('time',t.id,S.time===t.id?' on':'',t.l,`setTime('${t.id}')`)).join("")}
      </div>
      <div class="frow">
        <span class="flbl">Group by</span>
        ${GROUPS.map(g=>`<button class="pill${S.group===g.id?' on':''}" onclick="setGroup('${g.id}')">${g.l}</button>`).join("")}
        <span style="flex:1"></span>
        <span class="flbl">Sort</span>
        ${SORTS.map(s=>`<button class="pill${S.sort===s.id?' on':''}" onclick="setSort('${s.id}')" style="font-size:0.68rem">${s.l}</button>`).join("")}
      </div>
    </div>`;
  let searchTimer=null;
  document.getElementById("sb").addEventListener("input",function(e){
    S.q=e.target.value;saveState();
    document.getElementById("sx").style.display=S.q?'':'none';
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{renderShelves();updatePillCounts();},CONFIG.ui.searchDebounce);
  });
}
function clearSearch(){S.q="";saveState();renderFilters();renderShelves();}
function clearAll(){S.q=DEFAULT_STATE.q;S.pf=DEFAULT_STATE.pf;S.mood=DEFAULT_STATE.mood;S.time=DEFAULT_STATE.time;saveState();renderFilters();renderShelves();}
function chipsHTML(){
  const chips=[];
  if(S.q)chips.push({l:`“${esc(S.q)}”`,fn:"clearSearch()"});
  if(S.pf!=="any"){const f=PF.find(x=>x.id===S.pf);if(f)chips.push({l:`👥 ${f.l}`,fn:"setPF('any')"});}
  if(S.mood)chips.push({l:MOODS[S.mood]||S.mood,fn:"setMood(null)"});
  if(S.time!=="any"){const t=TF.find(x=>x.id===S.time);if(t)chips.push({l:`⏱ ${t.l}`,fn:"setTime('any')"});}
  let html=chips.map(c=>`<button class="fchip" onclick="${c.fn}" title="Remove this filter">${c.l}<span class="x">✕</span></button>`).join("");
  if(chips.length>=2)html+=`<button class="fchip" onclick="clearAll()">Clear all</button>`;
  return html;
}

let lastPick=null;
function pickRandom(){
  let list=getFiltered();
  if(!list.length)return;
  if(list.length>1)list=list.filter(g=>g.id!==lastPick);
  const g=list[Math.floor(Math.random()*list.length)];
  lastPick=g.id;
  document.querySelectorAll('.diceBtn').forEach(b=>{b.classList.remove('anim');void b.offsetWidth;b.classList.add('anim');});
  openModal(g,true);
}

function getGroups(list){
  const gid=S.group;
  if(gid==="shelf"){
    return SHELVES.map(s=>({name:s.name,desc:s.desc,icon:s.icon,games:list.filter(g=>g.shelf===s.id)})).filter(s=>s.games.length);
  }
  if(gid==="weight"){
    return WEIGHT_GROUPS.map(w=>({name:w.name,desc:w.desc,icon:w.icon,games:list.filter(g=>wCat(g.w)===w.id)})).filter(s=>s.games.length);
  }
  if(gid==="mood"){
    return MOOD_GROUPS.map(m=>({name:m.name,desc:m.desc,icon:m.icon,games:list.filter(g=>g.md.includes(m.id))})).filter(s=>s.games.length);
  }
  if(gid==="time"){
    return TIME_GROUPS.map(t=>({name:t.name,desc:t.desc,icon:t.icon,games:list.filter(g=>timeGroup(g.t)===t.id)})).filter(s=>s.games.length);
  }
  return [{name:"All Games",desc:"",games:list}];
}

function renderShelves(){
  const list=getFiltered();
  const container=document.getElementById("shelves");
  const st=document.getElementById("status");
  const countText=list.length===G.length?`Showing all ${G.length} games`:`Showing ${list.length} of ${G.length} games`;
  st.innerHTML=`<span>${countText}</span>${chipsHTML()}`;

  if(!list.length){
    container.innerHTML=`<div class="empty"><h3>No games found</h3><p>Remove a filter to see games:</p><div class="echips">${chipsHTML()}</div></div>`;
    renderCompare();return;
  }

  const groups=getGroups(list);
  const sortFn=(SORTS.find(s=>s.id===S.sort)||SORTS[0]).f;
  let html='';
  groups.forEach(grp=>{
    const sorted=[...grp.games].sort(sortFn);
    html+=`<div class="shelf">
      <div class="shelf-hdr">
        <div class="shelf-title">${grp.icon?grp.icon+' ':''}${grp.name}</div>
        <div class="shelf-count">${sorted.length} game${sorted.length!==1?'s':''}</div>
        ${grp.desc?`<div class="shelf-desc">${grp.desc}</div>`:''}
      </div>
      <div class="grid">${sorted.map(g=>cardHTML(g)).join("")}</div>
    </div>`;
  });
  container.innerHTML=html;
  attachCardListeners();renderCompare();
}

function cardHTML(g){
  const wc=wCat(g.w);const color=avColor(g.n);const cached=g.bgg&&imgCache[g.bgg];const isCmp=S.cmp.includes(g.id);
  return`<div class="card${isCmp?' cmp':''}" data-wc="${wc}" data-gid="${g.id}">
    <div class="card-thumb"${g.bgg?` data-id="${g.bgg}"`:''}>
      <img src="${cached||''}" alt="${g.n}" onload="this.classList.add('ld')" onerror="this.style.display='none'" ${cached?'':'style="display:none"'}>
      <div class="av" style="background:${avGradient(color)}">${g.i}</div>
    </div>
    <div class="card-body">
      <div class="card-title"><span class="wdot"></span>${g.n}</div>
      <div class="card-stats">
        <span class="tag tag-p">👥 ${g.p}</span>
        <span class="tag tag-t">⏱ ${g.t}m</span>
        <span class="tag tag-w">${WLABELS[wc]} · ${g.w.toFixed(1)}</span>
      </div>
      <div class="card-vibe">${g.v}</div>
      <div class="card-mechs">${g.m.map(m=>`<span class="mech">${ML[m]}</span>`).join("")}</div>
    </div>
    <div class="cf${isCmp?' sel':''}" data-cmp="${g.id}" title="Compare">${isCmp?'⚖️':'➕'}</div>
  </div>`;
}

function attachCardListeners(){
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click',function(e){
      if(e.target.closest('.cf'))return;
      const g=G.find(x=>x.id===this.dataset.gid);if(g)openModal(g);
    });
  });
  document.querySelectorAll('.cf').forEach(btn=>{
    btn.addEventListener('click',function(e){e.stopPropagation();toggleCmp(this.dataset.cmp);});
  });
}

function openModal(g,isRandom){
  const color=avColor(g.n);const wc=wCat(g.w);const shelf=SHELVES.find(s=>s.id===g.shelf);
  document.getElementById('m-roll').style.display=isRandom?'flex':'none';
  const img=document.getElementById('m-img');img.classList.remove('ld');
  const cached=g.bgg&&imgCache[g.bgg];
  if(cached){img.src=cached;img.style.display='';}else{img.src='';img.style.display='none';}
  document.getElementById('m-av').textContent=g.i;document.getElementById('m-av').style.background=avGradient(color);
  document.getElementById('m-title').textContent=g.n;
  document.getElementById('m-stats').innerHTML=`
    <span class="tag tag-p">👥 ${g.p} players</span>
    <span class="tag tag-t">⏱ ${g.t} min</span>
    <span class="tag tag-w">${WLABELS[wc]} · ${g.w.toFixed(2)}</span>`;
  document.getElementById('m-shelf').textContent=shelf?`📚 ${shelf.name}`:'';
  document.getElementById('m-vibe').textContent=g.v;
  // Like / Dislike
  let ldHTML='<h3>What Players Say</h3><div class="likedis ld-cols">';
  if(g.pro&&g.pro.length){
    ldHTML+=`<div><div class="ld-title like">👍 You might like this game if...</div><ul>${g.pro.map(p=>`<li>${p}</li>`).join('')}</ul></div>`;
  }
  if(g.con&&g.con.length){
    ldHTML+=`<div><div class="ld-title dislike">👎 You might not like this game if...</div><ul>${g.con.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  }
  ldHTML+='</div>';
  document.getElementById('m-ld-section').innerHTML=ldHTML;
  document.getElementById('m-mechs').innerHTML=g.m.map(m=>`<span class="mech">${ML[m]}</span>`).join('');
  document.getElementById('m-moods').innerHTML=g.md.map(m=>`<span class="chip chip-${m}">${MOODS[m]||m}</span>`).join('');
  document.getElementById('m-btn').href=bggUrl(g);
  const ov=document.getElementById('overlay');ov.style.display='flex';
  requestAnimationFrame(()=>ov.classList.add('on'));
}

function closeModal(){const ov=document.getElementById('overlay');ov.classList.remove('on');setTimeout(()=>{ov.style.display='none';},CONFIG.ui.modalCloseDelay);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function toggleCmp(id){
  if(S.cmp.includes(id))S.cmp=S.cmp.filter(x=>x!==id);
  else if(S.cmp.length<CONFIG.ui.maxCompare)S.cmp.push(id);
  renderShelves();
}
function clearCmp(){S.cmp=[];renderShelves();}

function renderCompare(){
  const panel=document.getElementById("cpanel");
  if(S.cmp.length===0){panel.classList.remove("show");panel.innerHTML="";document.querySelector('.wrap').style.paddingBottom='80px';return;}
  const games=S.cmp.map(id=>G.find(g=>g.id===id)).filter(Boolean);
  function wBar(w){const pct=((w-1)/4)*100;const clrMap={5:'var(--rust)',4:'var(--gold)',3:'var(--forest)',2:'#5a9e7a',1:'#9e9a5e'};const clr=clrMap[wCat(w)]||'var(--gold)';return`${w.toFixed(1)} <span class="wbar" style="width:${Math.max(pct,8)}px;background:${clr}"></span>`;}
  function tr(lbl,fn){return`<tr><th>${lbl}</th>${games.map(g=>`<td>${fn(g)}</td>`).join("")}</tr>`;}
  panel.innerHTML=`
    <div class="cphdr"><h3>Compare ${games.length} game${games.length>1?'s':''}</h3><button class="cpclear" onclick="clearCmp()">✕ Clear</button></div>
    <div class="cptable-wrap"><table>
      <tr><th></th>${games.map(g=>`<td><div class="cpname">${g.n}</div><div class="cpvibe">${g.v.slice(0,80)}...</div></td>`).join("")}</tr>
      ${tr("Players",g=>g.p)}
      ${tr("Time",g=>g.t+"m")}
      ${tr("Weight",g=>wBar(g.w))}
      ${tr("Mechanics",g=>g.m.map(m=>ML[m]).join(", "))}
      ${tr("Mood",g=>g.md.map(d=>MOODS[d]||d).join(", "))}
      ${tr("Shelf",g=>{const s=SHELVES.find(c=>c.id===g.shelf);return s?s.name:g.shelf;})}
      <tr><th></th>${games.map(g=>`<td><a class="cpbgg" href="${bggUrl(g)}" target="_blank" rel="noopener">BGG ↗</a></td>`).join("")}</tr>
    </table></div>`;
  panel.classList.add("show");
  document.querySelector('.wrap').style.paddingBottom=(panel.offsetHeight+20)+'px';
}

function setPF(id){S.pf=id;saveState();renderFilters();renderShelves();}
function setMood(m){S.mood=S.mood===m?null:m;saveState();renderFilters();renderShelves();}
function setTime(id){S.time=id;saveState();renderFilters();renderShelves();}
function setGroup(id){S.group=id;saveState();renderFilters();renderShelves();}
function setSort(id){S.sort=id;saveState();renderFilters();renderShelves();}

document.getElementById("total").textContent=G.length;
renderFilters();renderShelves();fetchImages();
</script>
</body>
</html>
